<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family:sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
  h1 { font-size:20px; }
  button { width:100%; padding:14px; margin:6px 0; font-size:16px; border:0; border-radius:8px; background:#2d8cff; color:#fff; }
  button.sec { background:#333; }
  p { color:#aaa; font-size:14px; }
</style>
</head>
<body>
<h1>Meu Robozinho</h1>
<p>Abra o robo em tela cheia ou deixe ele flutuando sobre outros apps.</p>
<button onclick="Android.abrirTelaCheia()">Robo em tela cheia</button>
<button onclick="Android.ativarFlutuante()">Robo flutuante</button>
<button class="sec" onclick="Android.pararFlutuante()">Fechar robo flutuante</button>
<button class="sec" onclick="Android.alternarFundo()">Alternar fundo preto ou transparente</button>
<button class="sec" onclick="Android.alternarTamanho()">Alternar tamanho pequeno ou normal</button>
</body>
</html>
