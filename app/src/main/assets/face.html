<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; font-family:sans-serif; }
  body.tela { background:#000; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:14%; transition: transform .3s; }
  .olho { width:26vmin; height:34vmin; background:#fff; border-radius:30%; position:relative; transition: height .12s, transform .25s, border-radius .2s, width .2s; }
  #boca { position:absolute; bottom:18%; left:50%; width:14vmin; height:7vmin; margin-left:-7vmin; border-bottom:1.6vmin solid #fff; border-radius:0 0 100% 100%; opacity:0; transition:opacity .2s; }
  .lagrima { position:absolute; width:3vmin; height:5vmin; background:#6cf; border-radius:50%; opacity:0; top:60%; }
  .piscando .olho { height:3vmin !important; }
  .feliz .olho { border-radius:50% 50% 30% 30%; height:24vmin; }
  .feliz #boca { opacity:1; }
  .triste .olho { border-radius:30% 30% 50% 50%; }
  .triste .olho.e { transform: rotate(-12deg); }
  .triste .olho.d { transform: rotate(12deg); }
  .chorando .olho { border-radius:30% 30% 50% 50%; }
  .chorando .lagrima { opacity:1; animation: cai 1s infinite; }
  @keyframes cai { from{ transform:translateY(0); opacity:1 } to{ transform:translateY(12vmin); opacity:0 } }
  .dormindo .olho { height:3vmin; }
  .surpreso .olho { width:32vmin; height:42vmin; border-radius:50%; }
  .bravo .olho.e { transform: rotate(14deg); height:22vmin; }
  .bravo .olho.d { transform: rotate(-14deg); height:22vmin; }
  .amor .olho { background:#f36; clip-path: polygon(50% 100%,0 35%,15% 5%,50% 25%,85% 5%,100% 35%); border-radius:0; }
  .pensando .olho { height:20vmin; }
  .pensando #stage { transform: translate(-4vmin,-3vmin); }
  .ouvindo .olho { box-shadow: 0 0 3vmin #4af; }
  .falando #boca { opacity:1; animation: fala .25s infinite alternate; }
  @keyframes fala { from{ height:2vmin } to{ height:8vmin } }
  #status { position:absolute; left:0; right:0; bottom:4px; text-align:center; color:#6c6; font-size:11px; opacity:.8; pointer-events:none; }
</style>
</head>
<body class="tela">
<div id="stage">
  <div class="olho e"></div>
  <div class="olho d"></div>
</div>
<div id="boca"></div>
<div class="lagrima" style="left:30%"></div>
<div class="lagrima" style="left:62%"></div>
<div id="status"></div>

<script>
// ================= EXPRESSOES E ANIMACAO =================
const b = document.body, stage = document.getElementById('stage');
const estados = ['feliz','triste','chorando','dormindo','surpreso','bravo','amor','falando','pensando'];
let atual = '', timerCarinho = null, ocupado = false;

function expressao(nome) {
  estados.forEach(e => b.classList.remove(e));
  if (nome && nome !== 'neutro') b.classList.add(nome);
  atual = nome || '';
}
function olhar(x, y) { stage.style.transform = 'translate(' + x + 'vmin,' + y + 'vmin)'; }
function fundo(comFundo) { b.classList.toggle('tela', comFundo); }
function piscar() {
  if (atual === 'dormindo') return;
  b.classList.add('piscando');
  setTimeout(() => b.classList.remove('piscando'), 140);
}
setInterval(() => { if (Math.random() < 0.7) piscar(); }, 3200);
setInterval(() => {
  if (ocupado || atual === 'dormindo' || atual === 'chorando') return;
  olhar(Math.random() * 12 - 6, Math.random() * 6 - 3);
  setTimeout(() => { if (!ocupado) olhar(0, 0); }, 1400);
}, 5000);
function carinho() {
  if (ocupado) return;
  expressao('feliz');
  clearTimeout(timerCarinho);
  timerCarinho = setTimeout(() => expressao('neutro'), 3000);
}

const statusEl = document.getElementById('status');
function status(t) { statusEl.textContent = t; }
const ehFlutuante = (window.innerWidth < 500 && window.innerHeight < 400);

// ================= NOME DO ROBO =================
let nomeRobo = localStorage.getItem('nomeRobo') || '';

function tirarAcentos(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

// ================= VOZ (KOKORO) =================
let tts = null, vozPronta = false;

async function carregarVoz() {
  try {
    status('Baixando a voz... (so na primeira vez)');
    const { KokoroTTS } = await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm');
    tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
      dtype: 'q8',
      device: 'wasm'
    });
    vozPronta = true;
  } catch (e) {
    console.log(e);
    status('Voz natural indisponivel (' + (e.message || e) + '). Usando a voz do Android.');
  }
}

function vozPadrao(texto) {
  return new Promise(res => {
    try {
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR';
      u.onend = res; u.onerror = res;
      speechSynthesis.speak(u);
    } catch (e) { res(); }
  });
}

async function falar(texto) {
  pararEscuta();
  expressao('falando');
  try {
    if (vozPronta) {
      const audio = await tts.generate(texto, { voice: 'pm_alex' });
      const url = URL.createObjectURL(audio.toBlob());
      const el = new Audio(url);
      await new Promise(res => { el.onended = res; el.onerror = res; el.play().catch(res); });
      URL.revokeObjectURL(url);
    } else {
      await vozPadrao(texto);
    }
  } catch (e) { console.log(e); }
  expressao('neutro');
  iniciarEscuta();
}

// ================= CEREBRO (TRANSFORMERS.JS, PROCESSADOR) =================
let gerador = null, cerebroPronto = false;
let historico = [];

function promptSistema() {
  return 'Voce e um robozinho virtual chamado ' + nomeRobo + ', amigo do Douglas. Fale sempre em portugues do Brasil, de forma curta, calorosa e natural, em no maximo duas frases curtas. Voce nao sabe noticias nem fatos recentes, e diz isso com honestidade. No comeco de cada resposta escreva entre colchetes UMA emocao entre: feliz, triste, surpreso, bravo, amor, neutro. Exemplo: [feliz] Que legal te ver!';
}

async function carregarCerebro() {
  try {
    status('Baixando o cerebro... (so na primeira vez, pode demorar)');
    const tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5');
    gerador = await tf.pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
      dtype: 'q4',
      device: 'wasm',
      progress_callback: p => { if (p.status === 'progress') status('Cerebro: ' + Math.round(p.progress || 0) + '%'); }
    });
    cerebroPronto = true;
    status('');
  } catch (e) {
    console.log(e);
    status('Cerebro nao carregou (' + (e.message || e) + ')');
  }
}

async function pensar(textoUsuario) {
  if (!historico.length || historico[0].role !== 'system') historico.unshift({ role: 'system', content: promptSistema() });
  historico.push({ role: 'user', content: textoUsuario });
  const saida = await gerador(historico, { max_new_tokens: 80, temperature: 0.8, do_sample: true });
  const msgs = saida[0].generated_text;
  let resposta = (msgs[msgs.length - 1].content || '').trim();
  historico.push({ role: 'assistant', content: resposta });
  if (historico.length > 13) historico.splice(1, 2);
  return resposta;
}

// ================= CONVERSA =================
async function tratarFala(frase) {
  if (ocupado) return;
  const limpa = frase.trim();
  if (!limpa) return;

  // Fase 1: ainda nao tem nome. A primeira fala e o nome escolhido.
  if (!nomeRobo) {
    ocupado = true;
    let nome = limpa.replace(/[.,!?]/g, '').replace(/^(pode me chamar de|pode te chamar de|te chamar de|seu nome e|seu nome é|vou te chamar de|chamo voce de|chamo você de|o nome e|o nome é|se chama|chama)\s+/i, '').trim();
    nome = nome.split(' ').slice(0, 2).join(' ');
    nome = nome.charAt(0).toUpperCase() + nome.slice(1);
    nomeRobo = nome;
    localStorage.setItem('nomeRobo', nomeRobo);
    expressao('feliz');
    await falar('Gostei! Pode me chamar de ' + nomeRobo + '. Quando quiser falar comigo, comece dizendo meu nome.');
    ocupado = false;
    return;
  }

  // Fase 2: so responde se a frase comecar com o nome dele.
  const norm = tirarAcentos(limpa);
  const nomeNorm = tirarAcentos(nomeRobo);
  const idx = norm.indexOf(nomeNorm);
  if (idx < 0 || idx > 12) return;
  let pergunta = limpa.slice(idx + nomeRobo.length).replace(/^[\s,.:!?-]+/, '');
  if (!pergunta) pergunta = 'Oi!';

  ocupado = true;
  pararEscuta();
  expressao('pensando');
  status('Pensando...');
  try {
    let resposta = await pensar(pergunta);
    let emocao = 'neutro';
    const m = resposta.match(/^\s*\[(\w+)\]\s*/);
    if (m) { emocao = m[1].toLowerCase(); resposta = resposta.replace(m[0], ''); }
    status('');
    if (estados.indexOf(emocao) >= 0 && emocao !== 'neutro') expressao(emocao);
    await falar(resposta);
  } catch (e) {
    console.log(e);
    status('Erro ao pensar (' + (e.message || e) + ')');
    expressao('triste');
    iniciarEscuta();
  }
  ocupado = false;
}

// ================= ESCUTA CONTINUA =================
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escutando = false, querEscutar = false;

function iniciarEscuta() {
  querEscutar = true;
  if (!rec || escutando) return;
  try { rec.start(); } catch (e) {}
}
function pararEscuta() {
  querEscutar = false;
  if (rec && escutando) { try { rec.stop(); } catch (e) {} }
}

if (Reconhecimento) {
  rec = new Reconhecimento();
  rec.lang = 'pt-BR';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onstart = () => { escutando = true; b.classList.add('ouvindo'); };
  rec.onend = () => {
    escutando = false; b.classList.remove('ouvindo');
    if (querEscutar) setTimeout(() => { try { rec.start(); } catch (e) {} }, 300);
  };
  rec.onerror = () => {};
  rec.onresult = e => tratarFala(e.results[0][0].transcript);
} else {
  status('Este aparelho nao tem reconhecimento de voz no navegador.');
}

// ================= INICIO =================
async function comecar() {
  await carregarVoz();
  await carregarCerebro();
  if (!cerebroPronto) return;
  status('Pronto! Toque uma vez na tela.');
}

let iniciou = false;
document.addEventListener('click', async () => {
  if (ehFlutuante) { carinho(); return; }
  if (!cerebroPronto) { carinho(); return; }
  if (iniciou) { carinho(); return; }
  iniciou = true;
  status('');
  if (!nomeRobo) {
    ocupado = true;
    expressao('feliz');
    await falar('Oi! Eu sou o seu robozinho e ainda nao tenho nome. Como voce quer me chamar?');
    ocupado = false;
  } else {
    iniciarEscuta();
    await falar('Oi, estou de volta! Pode falar comigo.');
  }
});

if (!ehFlutuante) comecar();
</script>
</body>
</html>
